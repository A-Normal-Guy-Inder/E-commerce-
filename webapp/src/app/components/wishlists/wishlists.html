<h4 class="text-xl font-bold mt-4 mb-2">Wishlist:</h4>
<div class="flex flex-wrap gap-4 mb-4 items-stretch">
  @for (product of wishlistService.wishlists(); track product._id; let i = $index) {
    <div class="w-auto flex items-center">
      <app-product-card [product]="product"></app-product-card>
    </div>
  }
</div>
@if (wishlistService.wishlists().length==0) {
  <h6 class="text-md mb-2">No Items in Wishlist</h6>
}
